spring.application.name=shortener

server.port=8085
app.base-url= http://localhost:8085
app.short-code-length= 7
app.cache.ttl=24h

#Mongodb >>
spring.mongodb.uri=mongodb://localhost:27017/urlshortener
spring.data.mongodb.auto-index-creation=true

# Redis >>
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Rate limiting >>
rate-limit.capacity=1000
rate-limit.refill-tokens=1000
rate-limit.refill-duration=1m

# Actuator & Prometheus >>
management.endpoints.web.exposure.include= health,info,metrics,prometheus,caches
management.endpoint.health.show-details= when_authorized
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true

#Logging >>
logging.level.com.shortener= DEBUG
logging.level.io.github.bucket4j= INFO

#Docs >>
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html